{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "New Statement" %}</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <style>
        body { background-color: #000; color: #fff; padding-bottom: 80px; }
        .form-control, .form-select {
            background-color: #1a1a1a;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            border-radius: 0;
            padding: 10px 0;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1a1a1a;
            border-color: #3498db;
            color: #fff;
            box-shadow: none;
        }
        .form-label { color: #888; font-size: 0.9rem; margin-top: 15px; }
        .global-loading {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1100;
        }
        .global-loading .card {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="globalLoading" class="global-loading" aria-live="polite" aria-busy="true">
        <div class="card">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <span>{% trans "Loading..." %}</span>
        </div>
    </div>

    <div class="container mt-3">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <button type="button" id="page-back-btn" class="btn btn-sm btn-outline-light rounded-pill" data-no-loading>
                <i class="fas fa-arrow-left me-1"></i>{% trans "Back" %}
            </button>
            <h4 class="mb-0 fw-bold">{% trans "New Statement" %}</h4>
            <div style="width: 20px;"></div>
        </div>

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">{% trans "Statement Name" %}</label>
                {{ form.title }}
            </div>

            <div class="row">
                <div class="col-6">
                    <div class="mb-3">
                        <label class="form-label">{% trans "Start Date" %}</label>
                        {{ form.start_date }}
                    </div>
                </div>
                <div class="col-6">
                    <div class="mb-3">
                        <label class="form-label">{% trans "End Date" %}</label>
                        {{ form.end_date }}
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">{% trans "Business Purpose" %}</label>
                {{ form.business_purpose }}
            </div>

            <div class="mt-5">
                <button type="submit" class="btn btn-primary w-100 py-3">{% trans "Save Statement" %}</button>
            </div>
        </form>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navStackKey = 'akaf_nav_stack_v1';
            const pageBackBtn = document.getElementById('page-back-btn');
            const globalLoading = document.getElementById('globalLoading');

            const readNavStack = () => {
                try {
                    const parsed = JSON.parse(sessionStorage.getItem(navStackKey) || '[]');
                    return Array.isArray(parsed) ? parsed : [];
                } catch (err) {
                    return [];
                }
            };

            const writeNavStack = (stack) => {
                try {
                    sessionStorage.setItem(navStackKey, JSON.stringify(stack.slice(-40)));
                } catch (err) {}
            };

            const normalizeUrl = (urlValue) => {
                try {
                    const url = new URL(urlValue, window.location.origin);
                    return `${url.pathname}${url.search}`;
                } catch (err) {
                    return urlValue || '';
                }
            };

            const navStack = readNavStack();
            const normalizedCurrent = normalizeUrl(window.location.href);
            if (!navStack.length || normalizeUrl(navStack[navStack.length - 1]) !== normalizedCurrent) {
                navStack.push(window.location.href);
                writeNavStack(navStack);
            }

            pageBackBtn?.addEventListener('click', () => {
                const stack = readNavStack();
                const currentNormalized = normalizeUrl(window.location.href);
                while (stack.length && normalizeUrl(stack[stack.length - 1]) === currentNormalized) {
                    stack.pop();
                }

                if (stack.length) {
                    const target = stack.pop();
                    writeNavStack(stack);
                    window.location.href = target;
                    return;
                }

                if (window.history.length > 1) {
                    window.history.back();
                    return;
                }
                window.location.href = "{% url 'expenses:dashboard' %}";
            });

            function showGlobalLoading() {
                globalLoading.style.display = 'flex';
            }

            function hideGlobalLoading() {
                globalLoading.style.display = 'none';
            }

            document.querySelectorAll('a[href]:not([data-no-loading])').forEach((link) => {
                link.addEventListener('click', function() {
                    showGlobalLoading();
                });
            });

            document.querySelectorAll('form').forEach((form) => {
                form.addEventListener('submit', function() {
                    showGlobalLoading();
                });
            });

            hideGlobalLoading();
        });
    </script>
</body>
</html>
