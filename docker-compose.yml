services:
  db:
    image: mysql:8.0
    container_name: menu-mysql
    restart: always
    environment:
      MYSQL_DATABASE: pc_software_db
      MYSQL_USER: pc_user
      MYSQL_PASSWORD: pc_password_123
      MYSQL_ROOT_PASSWORD: root_password_123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  web:
    build: .
    container_name: menu-django
    restart: always
    depends_on:
      - db
    volumes:
      - .:/app
      - static_volume:/app/staticfiles   # اضافه شده
      - media_volume:/app/media          # اضافه شده
    ports:
      - "8001:8000"
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: menu-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - web

volumes:
  mysql_data:
  static_volume:
  media_volume:
