{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">{% trans "Create New Trip" %}</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">{% trans "Trip Name" %}</label>
                    {{ form.name }}
                    {% if form.name.errors %}
                        <div class="text-danger small">{{ form.name.errors }}</div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Travel Type" %}</label>
                    <div class="d-flex gap-3">
                        {% for radio in form.travel_type %}
                        <div class="form-check">
                            {{ radio.tag }}
                            <label class="form-check-label" for="{{ radio.id_for_label }}">
                                {{ radio.choice_label }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">{% trans "Business Purpose" %}</label>
                    {{ form.business_purpose }}
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">{% trans "Save Trip" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
